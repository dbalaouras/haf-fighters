<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>HAF Fighters — 5v5 Dogfight</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #05070c; }
      body { font-family: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; color: #cfe6ff; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }
      #scene { position: absolute; inset: 0; }
      #hud { position: absolute; inset: 0; pointer-events: none; }
      #overlay {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        background: radial-gradient(ellipse at center, rgba(6,12,22,.82), rgba(2,4,8,.96));
        backdrop-filter: blur(3px); z-index: 10; cursor: pointer;
      }
      #overlay.hidden { display: none; }

      .panel {
        width: min(780px, 94vw); max-height: 94vh; overflow-y: auto; overflow-x: hidden;
        border: 1px solid rgba(120,190,255,.28); background: rgba(8,16,28,.82); padding: 26px 30px;
      }
      .panel h1 { font-size: 32px; letter-spacing: .3em; font-weight: 600; color: #eaf5ff; }
      .panel .sub { margin-top: 6px; color: #6f9dc8; font-size: 11px; letter-spacing: .22em; }

      .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; margin: 22px 0 18px; }
      @media (max-width: 620px) { .cols { grid-template-columns: 1fr; gap: 18px; } }

      .block { min-width: 0; }
      .bhead {
        font-size: 10px; letter-spacing: .26em; text-transform: uppercase;
        color: #7fe3b0; padding-bottom: 7px; margin-bottom: 4px;
        border-bottom: 1px solid rgba(127,227,176,.22);
      }

      .srow {
        display: flex; align-items: center; justify-content: space-between; gap: 12px;
        padding: 6px 6px 6px 2px; margin: 0 -6px 0 -2px; font-size: 12.5px;
        border-bottom: 1px dashed rgba(120,190,255,.1); border-radius: 3px;
      }
      .srow:not(.static) { cursor: pointer; }
      .srow:not(.static):hover { background: rgba(127,227,176,.09); }
      .srow span { display: flex; align-items: baseline; gap: 7px; min-width: 0; }
      .srow span i { font-style: normal; font-size: 9.5px; letter-spacing: .12em; color: #4e739a; }

      .srow em { font-style: normal; font-size: 11px; letter-spacing: .12em; white-space: nowrap; }
      .srow em.on { color: #8ff0b4; }
      .srow em.off { color: #5b7793; }
      .srow em.key { color: #7fd4ff; }

      .stepper { display: flex; align-items: center; gap: 8px; }
      .stepper b {
        display: inline-flex; align-items: center; justify-content: center;
        width: 19px; height: 19px; font-weight: 400; font-size: 13px; cursor: pointer;
        border: 1px solid rgba(127,227,176,.4); color: #8ff0b4; border-radius: 2px;
      }
      .stepper b:hover { background: rgba(127,227,176,.16); }
      .stepper u { text-decoration: none; font-size: 11px; color: #cfe6ff; min-width: 34px; text-align: right; }

      .bsub {
        font-size: 9.5px; letter-spacing: .22em; text-transform: uppercase;
        color: #4e739a; margin: 12px 0 4px;
      }
      .srow em.key.capturing { color: #ffd166; animation: blink 0.7s infinite; }
      .srow em.key.unbound { color: #7d5560; }

      .sreset {
        display: inline-block; margin-top: 10px; font-size: 10px; letter-spacing: .16em;
        color: #5b7793; cursor: pointer; text-transform: uppercase;
      }
      .sreset:hover { color: #9fb8d0; }

      /* ---- action buttons ---- */
      .acts { display: flex; gap: 10px; justify-content: center; margin: 4px 0 12px; }
      .act {
        font: inherit; font-size: 12px; letter-spacing: .2em; cursor: pointer;
        padding: 10px 22px; background: transparent; color: #9fb8d0;
        border: 1px solid rgba(120,190,255,.32); border-radius: 2px;
      }
      .act:hover { background: rgba(127,227,176,.1); color: #dffff0; }
      .act.primary { color: #9ff0a8; border-color: rgba(127,227,176,.55); }
      .act.primary:hover { background: rgba(127,227,176,.18); }
      .panel.wide { width: min(1120px, 96vw); }

      /* ---- scoreboard ---- */
      #scoreboard {
        position: absolute; inset: 0; z-index: 9; display: flex;
        align-items: center; justify-content: center; pointer-events: none;
        background: rgba(4, 9, 16, .72); backdrop-filter: blur(2px);
      }
      #scoreboard.hidden { display: none; }
      /* inside a panel it fills the panel; standalone it sizes itself */
      .sb { width: 100%; }
      #scoreboard .sb {
        width: min(1120px, 95vw);
        border: 1px solid rgba(120,190,255,.22); background: rgba(8,16,28,.82); padding: 20px 24px;
      }
      .sb-head {
        display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
        padding-bottom: 14px; margin-bottom: 14px;
        border-bottom: 1px solid rgba(120,190,255,.16);
      }
      .sb-mode { font-size: 13px; letter-spacing: .2em; color: #eaf5ff; }
      .sb-mode span { display: block; font-size: 10px; letter-spacing: .22em; color: #5d84a8; margin-top: 4px; }
      .sb-score { display: flex; align-items: center; gap: 18px; }
      .sb-score b { font-size: 30px; font-weight: 500; }
      .sb-score b.blue { color: #5ab6ff; }
      .sb-score b.red { color: #ff7a66; }
      .sb-score span { font-size: 17px; letter-spacing: .26em; color: #eaf5ff; }
      .sb-meta { text-align: right; font-size: 13px; letter-spacing: .16em; color: #eaf5ff; }
      .sb-meta span { display: block; font-size: 10px; letter-spacing: .22em; color: #5d84a8; margin-top: 4px; }

      .sb-tables { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
      @media (max-width: 780px) { .sb-tables { grid-template-columns: 1fr; } }

      .sb-row {
        display: grid; grid-template-columns: 1fr 78px 92px 74px; align-items: center;
        gap: 8px; padding: 8px 10px; font-size: 12.5px; border-bottom: 1px solid rgba(0,0,0,.25);
      }
      .sb-team.blue .sb-row { background: rgba(56,132,196,.24); }
      .sb-team.red .sb-row { background: rgba(196,78,60,.24); }
      .sb-row.sb-th {
        background: transparent !important; color: #7fa6c8; font-size: 10px;
        letter-spacing: .18em; border-bottom: 1px solid rgba(120,190,255,.2);
      }
      .sb-team.blue .sb-row.me { background: rgba(120,200,255,.44); }
      .sb-team.red .sb-row.me { background: rgba(255,130,110,.4); }
      .sb-row.me { box-shadow: inset 2px 0 0 #eaf5ff; }
      .sb-row.down { opacity: .55; }
      .sb-name { display: flex; align-items: center; gap: 8px; color: #eaf5ff; min-width: 0; }
      .sb-name u {
        text-decoration: none; font-size: 9.5px; letter-spacing: .14em;
        color: #ffb3a6; border: 1px solid rgba(255,140,120,.4); padding: 1px 5px; border-radius: 2px;
      }
      .sb-air, .sb-kda, .sb-pts { text-align: right; color: #cfe6ff; }
      .sb-air { color: #9fb8d0; }
      .sb-pts { color: #fff; }
      .sb-rank {
        font-style: normal; display: inline-flex; align-items: center; justify-content: center;
        width: 17px; height: 17px; border-radius: 50%; font-size: 10px; color: #201a05; flex: none;
      }
      .sb-rank.gold { background: #ffd166; }
      .sb-rank.silver { background: #cfd8e3; }
      .sb-rank.bronze { background: #d2955c; }

      /* ---- title screen ---- */
      /* Wide and short by design: the selectors sit side by side so the whole
         screen — including Enter Battle — fits without a scrollbar. */
      .title-panel {
        position: relative; text-align: center;
        width: min(980px, 95vw); padding: 34px 40px 26px;
      }
      .title-panel.narrow { width: min(520px, 92vw); padding: 46px 40px 34px; }

      .title-block { display: flex; flex-direction: column; align-items: center; gap: 7px; }
      .title-panel .sub { margin: 0; }
      .title-panel .sub.dim { color: #4e739a; font-size: 10px; }
      .eyebrow { font-size: 11px; letter-spacing: .38em; color: #5d84a8; }
      .game-title {
        /* monospace at .16em tracking runs about 8.9em wide for this title, so the
           ceiling is set to fit the panel's content box rather than by eye. It is
           allowed to wrap: nowrap clipped the title clean off on a narrow window. */
        font-size: clamp(24px, 5.6vw, 46px); font-weight: 600; line-height: 1.1;
        letter-spacing: .16em; color: #7fe3b0;
        text-wrap: balance;
        text-shadow: 0 0 26px rgba(127, 227, 176, .22);
      }
      @media (max-width: 420px) {
        .game-title { letter-spacing: .08em; }
      }
      .game-title span { color: #eaf5ff; }

      .rule {
        width: 74px; height: 1px; margin: 18px auto 0;
        background: linear-gradient(90deg, transparent, rgba(120,190,255,.4), transparent);
      }

      /* ---- mode picker: one row, above the columns ---- */
      .modes { display: flex; gap: 10px; margin-top: 20px; }
      .mode {
        flex: 1; display: flex; flex-direction: column; gap: 3px;
        font: inherit; text-align: left; cursor: pointer;
        padding: 9px 12px; background: rgba(6,14,24,.5); color: #9fb8d0;
        border: 1px solid rgba(120,190,255,.18); border-radius: 2px;
        transition: border-color .14s, background .14s;
      }
      .mode:hover { border-color: rgba(120,190,255,.42); background: rgba(8,20,30,.72); }
      .mode.on { border-color: rgba(127,227,176,.72); background: rgba(18,40,36,.6); }
      .mode b {
        font-size: 12px; font-weight: 500; letter-spacing: .14em; color: #cfe6ff;
      }
      .mode.on b { color: #9ff0a8; }
      .mode i { font-style: normal; font-size: 10px; line-height: 1.4; color: #4e739a; }

      /* ---- selection columns ---- */
      .choices {
        display: grid; grid-template-columns: repeat(3, 1fr);
        gap: 12px; margin-top: 14px; text-align: left;
      }

      .choice { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
      .choice-head {
        font-size: 9.5px; letter-spacing: .26em; text-transform: uppercase;
        color: #5d84a8; padding-bottom: 4px;
        border-bottom: 1px solid rgba(120,190,255,.14);
      }

      .opt {
        display: flex; flex-direction: column; gap: 5px; width: 100%;
        font: inherit; text-align: left; cursor: pointer;
        padding: 9px 11px; background: rgba(6,14,24,.5); color: #9fb8d0;
        border: 1px solid rgba(120,190,255,.18); border-radius: 2px;
        transition: border-color .14s, background .14s;
      }
      .opt:hover { border-color: rgba(120,190,255,.42); background: rgba(8,20,30,.72); }
      .opt.on { border-color: rgba(127,227,176,.72); background: rgba(18,40,36,.6); }

      .opt-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
      .opt-top b {
        font-size: 12.5px; font-weight: 500; letter-spacing: .12em; color: #cfe6ff;
      }
      .opt.on .opt-top b { color: #9ff0a8; }
      .opt-top i {
        font-style: normal; font-size: 9px; letter-spacing: .12em; color: #5d84a8;
        white-space: nowrap;
      }
      .opt-sub { font-size: 10px; line-height: 1.45; color: #4e739a; }

      .bars { display: flex; gap: 8px; }
      .bar { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
      .bar i {
        font-style: normal; font-size: 8px; letter-spacing: .14em; color: #47688a;
      }
      .bar u { display: block; height: 3px; background: rgba(120,190,255,.16); border-radius: 1px; }
      .bar u b { display: block; height: 100%; background: #6f9dc8; border-radius: 1px; }
      .opt.on .bar u b { background: #7fe3b0; }

      /* ---- launch row: callsign and the button share a line ---- */
      .launch-row {
        display: flex; align-items: center; justify-content: center;
        gap: 14px; flex-wrap: wrap; margin-top: 22px;
      }
      .field-inline { display: flex; align-items: center; gap: 10px; }
      .field-inline span {
        font-size: 9.5px; letter-spacing: .28em; color: #5d84a8; white-space: nowrap;
      }

      /* the input and the button share a width, so they sit on one centre line */
      .launch {
        display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 26px;
      }
      .field { display: flex; flex-direction: column; align-items: center; gap: 9px; }
      .field span { font-size: 9.5px; letter-spacing: .3em; color: #5d84a8; }
      .callsign {
        font: inherit; font-size: 15px; letter-spacing: .16em; text-align: center;
        width: 262px; padding: 11px 12px; color: #eaf5ff; background: rgba(6,14,24,.72);
        border: 1px solid rgba(120,190,255,.28); border-radius: 2px; outline: none;
        transition: border-color .15s, background .15s;
      }
      .callsign:hover { border-color: rgba(120,190,255,.45); }
      .callsign:focus { border-color: rgba(127,227,176,.75); background: rgba(8,20,30,.92); }

      .launch .act.big { width: 262px; padding: 13px 0; font-size: 13px; }
      .launch-row .act.big { padding: 12px 34px; font-size: 13px; }
      .launch-row .callsign { width: 190px; padding: 10px 12px; font-size: 14px; }

      /* one condensed control line, ruled off from the choices above it */
      .hint {
        margin-top: 18px; padding-top: 14px;
        border-top: 1px solid rgba(120,190,255,.12);
        font-size: 10.5px; letter-spacing: .06em; color: #6f9dc8; line-height: 1.9;
        text-wrap: balance;
      }
      .hint b { font-weight: 500; color: #cfe6ff; }

      .keys {
        display: flex; flex-wrap: wrap; justify-content: center;
        gap: 9px 10px; margin-top: 30px;
      }
      .keys span {
        display: inline-flex; align-items: center; gap: 6px;
        font-size: 10.5px; letter-spacing: .1em; color: #6f9dc8;
      }
      .keys b {
        font-weight: 500; color: #9ff0a8; padding: 3px 7px; border-radius: 2px;
        background: rgba(127,227,176,.09); border: 1px solid rgba(127,227,176,.22);
      }
      .fineprint {
        margin-top: 20px; font-size: 10px; letter-spacing: .14em; color: #47688a;
      }

      .gear {
        position: absolute; top: 16px; right: 16px; width: 36px; height: 36px;
        display: flex; align-items: center; justify-content: center; cursor: pointer;
        background: transparent; color: #6f9dc8; border: 1px solid rgba(120,190,255,.24);
        border-radius: 50%; transition: color .15s, border-color .15s, transform .35s;
      }
      .gear:hover { color: #9ff0a8; border-color: rgba(127,227,176,.6); transform: rotate(60deg); }

      .panel-head { display: flex; align-items: center; gap: 18px; margin-bottom: 20px; }
      .panel-head h2 { font-size: 14px; letter-spacing: .32em; color: #eaf5ff; font-weight: 500; }

      .act.big { padding: 14px 42px; font-size: 14px; }
      .act.ghost { padding: 7px 14px; font-size: 10px; border-color: rgba(120,190,255,.2); }

      .note {
        margin-top: 16px; padding-top: 12px; border-top: 1px solid rgba(120,190,255,.12);
        font-size: 11px; color: #5d84a8; line-height: 1.7;
      }
      .note b { color: #8ff0b4; font-weight: 500; }
      .note i { color: #9fb8d0; }
      @keyframes blink { 50% { opacity: .32; } }

      /* ---- title-screen responsive tiers ----
         Kept last in the sheet: these override base rules at equal specificity,
         so declaration order is what makes them apply. */
      @media (max-width: 780px) {
        .title-panel { padding: 24px 18px 18px; }
        .choices { gap: 8px; margin-top: 16px; }
        .opt { padding: 7px 9px; gap: 4px; }
        .opt-sub { font-size: 9px; }
        .launch-row { margin-top: 16px; }
      }
      /* Last resort: one column is what brings the scrollbar back, so shed the
         stat bars (the tallest part) — the load line still ranks the jets. */
      @media (max-width: 620px) {
        .modes { flex-direction: column; gap: 6px; margin-top: 12px; }
        .choices { grid-template-columns: 1fr 1fr; margin-top: 12px; }
        .bars { display: none; }
        .hint { margin-top: 12px; padding-top: 10px; line-height: 1.7; font-size: 10px; }
        .game-title { font-size: clamp(22px, 6.4vw, 32px); }
        .rule { margin-top: 12px; }
        .launch-row { margin-top: 12px; gap: 10px; }
        .launch-row .act.big { padding: 10px 24px; }
        .launch-row .callsign { width: 150px; padding: 8px 10px; }
      }
      @media (max-width: 430px) { .choices { grid-template-columns: 1fr; } }
      /* Short windows: let the panel scroll inside itself rather than the page. */
      @media (max-height: 560px) {
        .title-panel { max-height: 94vh; overflow-y: auto; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <canvas id="hud"></canvas>
      <div id="scoreboard" class="hidden"></div>
      <div id="overlay"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
